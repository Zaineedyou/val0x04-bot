[package]
name = "val0x04"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
serenity = { version = "0.12", default-features = false, features = [
	"builder",
	"client",
	"gateway",
	"http",
	"model",
	"rustls_backend",
	"cache",
] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
